server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so React Router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container so the browser only ever talks to one origin.
    location /api/ {
        proxy_pass http://backend:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # Keep SSE streaming responses unbuffered so tokens arrive as they're generated.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://backend:8787/health;
    }

    gzip on;
    gzip_types text/plain application/javascript application/json text/css;
}
